name: checks
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: python3 tools/check_locks.py && python3 tools/verify_spec.py
